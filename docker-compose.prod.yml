# EC2 runtime. Database maintenance runs once through classport-release.
# Application containers receive runtime credentials only.
name: classport-prod

services:
  classport:
    image: ${BACKEND_IMAGE:?Set the backend image digest in release.env}
    restart: unless-stopped
    env_file:
      - path: .env
        format: raw
    environment:
      STUDY_ROOT: /opt/courses
    volumes:
      - type: bind
        source: ./data/courses
        target: /opt/courses
        bind:
          create_host_path: false
      - type: bind
        source: ./certs
        target: /etc/classport/certs
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "http://localhost:8000/api/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [internal]

  redis:
    image: redis:7.4-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes", --appendfsync, everysec]
    volumes:
      - type: bind
        source: ./data/redis
        target: /data
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 6
    networks: [internal]

  worker:
    image: ${BACKEND_IMAGE:?Set the backend image digest in release.env}
    restart: unless-stopped
    command: [uv, run, --no-sync, celery, -A, "app.celery_app:celery", worker, --pool=prefork, "--concurrency=${WORKER_CONCURRENCY:-1}"]
    env_file:
      - path: .env
        format: raw
    environment:
      STUDY_ROOT: /opt/courses
      CELERY_BROKER_URL: redis://redis:6379/0
      DB_POOL_MIN_SIZE: "1"
      DB_POOL_MAX_SIZE: "2"
    volumes:
      - type: bind
        source: ./data/courses
        target: /opt/courses
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./certs
        target: /etc/classport/certs
        read_only: true
        bind:
          create_host_path: false
    stop_grace_period: 150s
    mem_limit: 512m
    cpus: "1.0"
    healthcheck:
      test: [CMD-SHELL, "uv run --no-sync celery -A app.celery_app:celery inspect ping -d celery@$$HOSTNAME --timeout 3"]
      interval: 15s
      timeout: 8s
      retries: 4
      start_period: 15s
    networks: [internal]

  dispatcher: &coordinator
    image: ${BACKEND_IMAGE:?Set the backend image digest in release.env}
    restart: unless-stopped
    command: [uv, run, --no-sync, python, -m, app.job_coordination, dispatch]
    env_file:
      - path: .env.coordinator
        format: raw
        required: false
    volumes:
      - type: bind
        source: ./certs
        target: /etc/classport/certs
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, python, -c, "import pathlib,time; assert time.time()-pathlib.Path('/tmp/classport-dispatch.heartbeat').stat().st_mtime < 30"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks: [internal]

  job-recovery:
    <<: *coordinator
    command: [uv, run, --no-sync, python, -m, app.job_coordination, recover]
    healthcheck:
      test: [CMD, python, -c, "import pathlib,time; assert time.time()-pathlib.Path('/tmp/classport-recover.heartbeat').stat().st_mtime < 30"]
      interval: 10s
      timeout: 3s
      retries: 3

  frontend:
    image: ${FRONTEND_IMAGE:?Set the frontend image digest in release.env}
    restart: unless-stopped
    depends_on:
      classport:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/login"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [internal]

  smoke:
    profiles: [maintenance]
    image: ${BACKEND_IMAGE:?Set the backend image digest in release.env}
    restart: "no"
    command: ["uv", "run", "--no-sync", "python", "scripts/smoke_release.py"]
    env_file:
      - path: .env.smoke
        format: raw
        required: false
    networks: [internal]

networks:
  internal:
    driver: bridge
