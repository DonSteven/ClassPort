#cloud-config
write_files:
  - path: /etc/classport/host.env
    permissions: '0600'
    encoding: b64
    content: ${host_env}
  - path: /etc/docker/daemon.json
    permissions: '0644'
    encoding: b64
    content: ${docker_config}
  - path: /etc/caddy/Caddyfile
    permissions: '0644'
    encoding: b64
    content: ${caddyfile}
  - path: /usr/local/sbin/classport-setup
    permissions: '0700'
    encoding: b64
    content: ${setup}
  - path: /usr/local/sbin/classport-release
    permissions: '0700'
    encoding: b64
    content: ${release}
runcmd:
  - [bash, /usr/local/sbin/classport-setup]
