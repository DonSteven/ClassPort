name: Deploy

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy (tag, branch, or SHA). Defaults to origin/main.'
        required: false
        default: 'origin/main'

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve deployment commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Select deployment ref
        id: target
        env:
          DEPLOY_REF: ${{ inputs.ref || github.sha }}
        run: echo "ref=${DEPLOY_REF#origin/}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}
      - name: Resolve commit SHA
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  checks:
    name: Pre-deploy checks
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  deploy:
    name: SSH deploy to Hetzner
    needs: [resolve, checks]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: 22
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd /opt/classport
            DEPLOY_SHA="${{ needs.resolve.outputs.sha }}"
            echo "Deploying commit: $DEPLOY_SHA"
            git fetch --all --tags
            git reset --hard "$DEPLOY_SHA"
            echo "Now at: $(git log -1 --oneline)"
            ./deploy.sh
