name: Deploy

permissions:
  contents: read

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit, tag or branch on main history to deploy'
        required: false
        default: main

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AWS_PAGER: ''

jobs:
  resolve:
    name: Resolve an allowed deployment commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - name: Require a commit on main history
        id: commit
        run: |
          git merge-base --is-ancestor HEAD origin/main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  checks:
    name: Pre-deploy checks
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  publish:
    name: Publish and verify the exact ECR image pair
    needs: [resolve, checks]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: publish-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: docker/setup-buildx-action@v4
      - name: Log in to the ECR registry
        env:
          BACKEND_REPOSITORY: ${{ vars.BACKEND_REPOSITORY }}
        run: |
          set -euo pipefail
          : "${BACKEND_REPOSITORY:?}"
          aws ecr get-login-password | docker login --username AWS --password-stdin "${BACKEND_REPOSITORY%%/*}"
      - name: Build missing SHA images and reuse existing immutable images
        env:
          RELEASE_COMMIT: ${{ needs.resolve.outputs.sha }}
          BACKEND_REPOSITORY: ${{ vars.BACKEND_REPOSITORY }}
          FRONTEND_REPOSITORY: ${{ vars.FRONTEND_REPOSITORY }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_SITE_NAME: ${{ vars.PUBLIC_SITE_NAME }}
          PUBLIC_SHOW_LANDING: ${{ vars.PUBLIC_SHOW_LANDING }}
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.PUBLIC_GOOGLE_SITE_VERIFICATION }}
        run: python scripts/publish_release.py
      - name: Smoke test the published digests with a disposable database
        env:
          CLASSPORT_TEST_RELEASE_COMMIT: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          source release/release.env
          export CLASSPORT_TEST_BACKEND_IMAGE="$BACKEND_IMAGE"
          export CLASSPORT_TEST_FRONTEND_IMAGE="$FRONTEND_IMAGE"
          docker pull "$BACKEND_IMAGE"
          docker pull "$FRONTEND_IMAGE"
          uv run --no-sync pytest tests/test_release_images.py -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-release
          path: release/
          if-no-files-found: ignore
          retention-days: 90

  deploy:
    name: Deploy verified release and wait for SSM result
    needs: [resolve, publish]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: production-release
          path: release
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: deploy-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Execute release, wait and retain command and application results
        timeout-minutes: 15
        env:
          AWS_INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
        run: python3 scripts/deploy_via_ssm.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-deployment-result
          path: release/
          if-no-files-found: error
          retention-days: 90

  result:
    name: Record pipeline outcome
    if: always()
    needs: [resolve, checks, publish, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Save every stage outcome
        env:
          STAGES: ${{ toJSON(needs) }}
          RELEASE_COMMIT: ${{ needs.resolve.outputs.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result = {"commit": os.environ["RELEASE_COMMIT"], "run_id": os.environ["GITHUB_RUN_ID"],
                    "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"], "stages": json.loads(os.environ["STAGES"])}
          Path("pipeline-result.json").write_text(json.dumps(result, indent=2) + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("| Stage | Result |\n|---|---|\n")
              for name, value in result["stages"].items():
                  summary.write(f"| {name} | {value['result']} |\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: production-pipeline-result
          path: pipeline-result.json
          retention-days: 90
      - name: Require all release stages to succeed
        env:
          STAGES: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          raise SystemExit(0 if all(stage["result"] == "success" for stage in json.loads(os.environ["STAGES"]).values()) else 1)
          PY
