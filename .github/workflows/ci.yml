name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: 'Commit SHA or ref to check'
        required: false
        type: string
        default: ''

jobs:
  infrastructure:
    name: AWS infrastructure (offline validation)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - run: terraform test
      - run: bash -n scripts/setup-host.sh scripts/release.sh
      - run: python3 -m py_compile scripts/bootstrap.py scripts/create-config.py

  backend:
    name: Backend (ruff + pytest + docker build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Prepare test configuration
        run: |
          cp .env.ci .env
          cp .env.docker.example .env.docker
          cp .env.migration.example .env.migration
          cp .env.coordinator.example .env.coordinator
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies (including test tools)
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run --no-sync ruff check app/ tests/ scripts/
      - name: Backend tests
        run: uv run --no-sync pytest
      - name: Validate Compose
        run: |
          docker compose -f docker-compose.yml --env-file .env.docker --profile local-db --profile maintenance config -q
          docker compose -f docker-compose.yml --env-file .env.docker config -q
          bash -n deploy.sh deploy-prod.sh
      - name: Docker build smoke
        run: docker build -t classport:ci-smoke .

  frontend:
    name: Frontend (production build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      VITE_API_BASE_URL: ''
      VITE_SITE_URL: 'http://localhost:8080'
      VITE_SITE_NAME: ClassPort
      VITE_SHOW_LANDING: 'false'
      VITE_GOOGLE_SITE_VERIFICATION: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'web/pnpm-lock.yaml'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Production build
        run: pnpm build
