# ClassPort stack: postgres + fastapi + frontend.
# All three containers live on an internal docker network. Only `frontend`
# (which serves the SPA and reverse-proxies API traffic to fastapi) and
# `classport` (kept exposed for direct curl debugging) are bound to the host.
# A user's outer reverse proxy (Caddy / nginx / Traefik / whatever)
# terminates TLS and forwards to 127.0.0.1:8080 (the frontend container).
#
# Bring up:   ./deploy.sh
# Logs:       docker compose logs -f classport
# Shell in:   docker compose exec classport bash

services:
  postgres:
    profiles: [local-db]
    image: postgres:16-alpine
    container_name: classport-postgres
    restart: unless-stopped
    env_file:
      - path: .env.docker
        format: raw
        required: false
    environment:
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - /opt/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks: [internal]
    # Never expose postgres to the host or internet — only the classport
    # backend talks to it via the internal docker network (psycopg pool).

  classport:
    build:
      context: .
      dockerfile: Dockerfile
    image: classport:latest
    container_name: classport
    restart: unless-stopped
    env_file:
      # Runtime settings only. Database administration credentials belong in
      # .env.migration / .env.docker, neither of which is loaded here.
      - path: .env
        format: raw
        required: true
      - path: .env.jobs
        format: raw
    environment:
      # Tell the storage layer where the canonical course tree lives.
      STUDY_ROOT: "/opt/courses"
    volumes:
      # Bind mount, not volume — files live on the host, container reads/writes
      # them in place. Same path inside and outside for sanity.
      - /opt/courses:/opt/courses:rw
      - ./certs:/etc/classport/certs:ro
    ports:
      # Bind to localhost only; Caddy on the host reverse-proxies in.
      - "127.0.0.1:8000:8000"
    healthcheck:
      # Container health reports readiness. Keep this path for image rollbacks.
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks: [internal]

  redis:
    image: redis:7.4-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes", --appendfsync, everysec]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 6
    networks: [internal]

  worker:
    image: classport:latest
    restart: unless-stopped
    command: [uv, run, --no-sync, celery, -A, "app.celery_app:celery", worker, --pool=prefork, "--concurrency=${WORKER_CONCURRENCY:-1}"]
    env_file:
      - path: .env
        format: raw
      - path: .env.jobs
        format: raw
    environment:
      STUDY_ROOT: /opt/courses
      CELERY_BROKER_URL: redis://redis:6379/0
      DB_POOL_MIN_SIZE: "1"
      DB_POOL_MAX_SIZE: "2"
    volumes:
      - /opt/courses:/opt/courses:ro
      - ./certs:/etc/classport/certs:ro
    stop_grace_period: 150s
    mem_limit: 512m
    cpus: "1.0"
    healthcheck:
      test: [CMD-SHELL, "uv run --no-sync celery -A app.celery_app:celery inspect ping -d celery@$$HOSTNAME --timeout 3"]
      interval: 15s
      timeout: 8s
      retries: 4
      start_period: 15s
    networks: [internal]

  dispatcher: &coordinator
    image: classport:latest
    restart: unless-stopped
    command: [uv, run, --no-sync, python, -m, app.job_coordination, dispatch]
    env_file:
      - path: .env.coordinator
        format: raw
        required: false
      - path: .env.jobs
        format: raw
    volumes:
      - ./certs:/etc/classport/certs:ro
    healthcheck:
      test: [CMD, python, -c, "import pathlib,time; assert time.time()-pathlib.Path('/tmp/classport-dispatch.heartbeat').stat().st_mtime < 30"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks: [internal]

  job-recovery:
    <<: *coordinator
    command: [uv, run, --no-sync, python, -m, app.job_coordination, recover]
    healthcheck:
      test: [CMD, python, -c, "import pathlib,time; assert time.time()-pathlib.Path('/tmp/classport-recover.heartbeat').stat().st_mtime < 30"]
      interval: 10s
      timeout: 3s
      retries: 3

  migrate:
    profiles: [maintenance]
    image: classport:latest
    command: ["uv", "run", "--no-sync", "python", "scripts/run_migrations.py"]
    env_file:
      - path: .env.migration
        format: raw
        # Running the app does not require a maintenance env file. deploy.sh
        # checks it before maintenance; direct runs validate the DSN in Python.
        required: false
    volumes:
      - ./certs:/etc/classport/certs:ro
    networks: [internal]

  frontend:
    build:
      # Context is the repo root (not just web/) because the Vite postbuild
      # invokes scripts/build-seo.mjs which lives one level up.
      context: .
      dockerfile: web/Dockerfile
      args:
        # Build-time env baked into the SPA bundle.
        #
        # API_BASE_URL is empty: the in-image Caddy proxies /api/* to the
        # classport container on the internal network, so the SPA always
        # talks to the API as same-origin.
        #
        # PUBLIC_SITE_URL / PUBLIC_SITE_NAME come from your .env.docker
        # (or shell env). They land in <link rel=canonical>, OpenGraph
        # tags, JSON-LD, robots.txt, sitemap.xml and the manifest. Set
        # them to YOUR domain and name; the localhost default keeps the
        # build deterministic for first-run dev but is not what you want
        # for a public deploy.
        VITE_API_BASE_URL: ""
        VITE_SITE_URL: "${PUBLIC_SITE_URL:-http://localhost:8080}"
        VITE_SITE_NAME: "${PUBLIC_SITE_NAME:-ClassPort}"
        VITE_SHOW_LANDING: "${PUBLIC_SHOW_LANDING:-false}"
        # Google Search Console verification token (paste from Search Console's
        # "HTML tag" verification — the value of `content="..."`). Empty by
        # default so each deployment supplies its own token.
        VITE_GOOGLE_SITE_VERIFICATION: "${PUBLIC_GOOGLE_SITE_VERIFICATION:-}"
    image: classport-frontend:latest
    container_name: classport-frontend
    restart: unless-stopped
    depends_on:
      classport:
        condition: service_started
    ports:
      # Bind to localhost only; the host's reverse proxy (Caddy etc.)
      # terminates TLS and forwards here.
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  redis-data:
